[package]
name = "tecan-worklist-builder"
version = "0.1.3"
edition = "2024"
description = "Rust worklist CSV validation and GWL generation"
license = "MIT"

[[bin]]
name = "tecan-worklist"
path = "src/main.rs"

[dependencies]
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
