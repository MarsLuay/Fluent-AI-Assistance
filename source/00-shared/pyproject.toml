[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tecan-common"
version = "0.1.1"
description = "Shared XML and command-registry helpers for the Fluent AI-Assistance workspace"
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1,<1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tecan_common = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["tecan_common*"]
