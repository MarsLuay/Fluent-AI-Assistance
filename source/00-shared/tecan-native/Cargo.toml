[package]
name = "tecan-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Optional Rust acceleration kernels for Fluent AI-Assistance"

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["macros"] }
quick-xml = { version = "0.39.4", features = ["encoding"] }
rayon = "1.10"
serde_json = "1"
sha2 = "0.10"
