- _template_source: handwritten
  category: user_interface
  confidence: 0.95
  description: >-
    Image-capable operator prompt. Emits a TouchTools/RUP RUPStandardStatement
    whose SelectedImagePath renders an actual on-screen image next to the
    message. Standalone (no deck labware binding required), unlike
    RUPWorktableStatement. Used for media/verification prompts; plain prompts
    keep using the UserPrompt command.
  id: UserPromptImage
  parameters: []
  template: |-
    <Object Type="Tecan.VisionX.TouchTools.Driver.RUP.RUPStandardStatement">
      <RUPStandardStatement>
        <StandardProperties>
          <StandardStatementDataClass>
            <SelectedImagePath>{{SelectedImagePath}}</SelectedImagePath>
            <MessageText>{{MessageText}}</MessageText>
            <SelectedSoundPath />
            <RepeatValue />
            <PercentCompleteString>0</PercentCompleteString>
            <PercentComplete>0</PercentComplete>
            <ShowProgress>false</ShowProgress>
            <DisplayStartTime>false</DisplayStartTime>
            <DisplayEndTime>false</DisplayEndTime>
            <DisplayPercentage>false</DisplayPercentage>
            <DisplayTimeRemaining>false</DisplayTimeRemaining>
            <DisplayTimeElapsed>false</DisplayTimeElapsed>
            <VariableScope />
          </StandardStatementDataClass>
        </StandardProperties>
        <CheckMessagePrompt>{{MessageText}}</CheckMessagePrompt>
        <PercentComplete>0</PercentComplete>
        <PercentCompleteString>0</PercentCompleteString>
        <RepeatValue></RepeatValue>
        <IsBreakpoint>{{IsBreakpoint}}</IsBreakpoint>
        <IsDisabledForExecution>{{IsDisabledForExecution}}</IsDisabledForExecution>
        <LineNumber>{{LineNumber}}</LineNumber>
        <RUPScreenTitle>{{RUPScreenTitle}}</RUPScreenTitle>
        <RUPDisplayAndWait>{{RUPDisplayAndWait}}</RUPDisplayAndWait>
        <RUPAutoClose>{{RUPAutoClose}}</RUPAutoClose>
        <RUPTimeOut>{{RUPTimeOut}}</RUPTimeOut>
        <ChangeStatusLightColor>False</ChangeStatusLightColor>
        <StatusLightColorString></StatusLightColorString>
      </RUPStandardStatement>
    </Object>
  type: Tecan.VisionX.TouchTools.Driver.RUP.RUPStandardStatement
